name: Supabase keep-alive

# Supabase free projects pause after ~7 days without activity.
# This pings the database through the public REST API once a day.

on:
  schedule:
    - cron: '17 3 * * *'   # every day at 03:17 UTC (08:47 IST)
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Missing VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY repository variables" >&2
            exit 1
          fi
          # Reads one row of 'plans' (publicly readable by design), so it is a real database query.
          status=$(curl -sS --retry 3 --retry-delay 10 -o response.json -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/plans?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "Supabase ping failed:" >&2
            cat response.json >&2
            exit 1
          fi
          echo "Supabase is awake."
